<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Garden Shed Clay Admin</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    .admin-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }

    .admin-header {
      margin-bottom: 40px;
    }

    .admin-header h1 {
      margin: 0 0 12px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(44px, 6vw, 68px);
      font-weight: 500;
      line-height: 1;
    }

    .admin-note {
      max-width: 700px;
      color: #6f695f;
    }

    .product-card-form {
      display: grid;
      gap: 28px;
      padding: 32px;
      border: 1px solid rgba(38, 35, 31, 0.16);
      background: #fff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .form-group {
      display: grid;
      gap: 8px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(38, 35, 31, 0.2);
      background: #fff;
      color: #26231f;
      font: inherit;
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 8px;
    }

    .preview-box {
      padding: 24px;
      border: 1px solid rgba(38, 35, 31, 0.16);
      background: #f8f5ef;
    }

    .preview-box h2 {
      margin-top: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 34px;
      font-weight: 500;
    }

    .preview-json {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      background: #26231f;
      color: #f8f5ef;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .product-card-form {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-page">
    <div class="admin-header">
      <p class="eyebrow">Garden Shed Clay</p>
      <h1>Product Admin</h1>

      <p class="admin-note">
        Create or edit pottery listings here. This first version
        generates a product record for review but does not publish
        anything yet.
      </p>
    </div>

    <form id="product-form" class="product-card-form">

      <div class="form-grid">

        <div class="form-group">
          <label class="form-label" for="name">
            Product name
          </label>
          <input
            class="form-input"
            id="name"
            name="name"
            type="text"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="slug">
            Slug
          </label>
          <input
            class="form-input"
            id="slug"
            name="slug"
            type="text"
            placeholder="moravian-star-brown-sugar-keeper"
          >
        </div>

        <div class="form-group full">
          <label class="form-label" for="description">
            Description
          </label>
          <textarea
            class="form-textarea"
            id="description"
            name="description"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="price">
            Price
          </label>
          <input
            class="form-input"
            id="price"
            name="price"
            type="number"
            step="0.01"
            min="0"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="inventory">
            Inventory
          </label>
          <input
            class="form-input"
            id="inventory"
            name="inventory"
            type="number"
            step="1"
            min="0"
          >
        </div>

        <div class="form-group full">
          <label class="form-label" for="images">
            Images
          </label>
          <textarea
            class="form-textarea"
            id="images"
            name="images"
            placeholder="moravian-star-brown-sugar-keeper-01.jpg&#10;moravian-star-brown-sugar-keeper-02.jpg"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="colors">
            Colors / glazes
          </label>
          <input
            class="form-input"
            id="colors"
            name="colors"
            type="text"
            placeholder="Natural earthenware, Blue glaze"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="tags">
            Tags
          </label>
          <input
            class="form-input"
            id="tags"
            name="tags"
            type="text"
            placeholder="kitchen pottery, earthenware, Moravian star"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="shipping-type">
            Shipping type
          </label>
          <select
            class="form-select"
            id="shipping-type"
            name="shipping-type"
          >
            <option value="flat-rate">Flat rate</option>
            <option value="free">Free shipping</option>
            <option value="calculated">Calculated</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="shipping-price">
            Shipping price
          </label>
          <input
            class="form-input"
            id="shipping-price"
            name="shipping-price"
            type="number"
            step="0.01"
            min="0"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="lead-time">
            Lead time
          </label>
          <input
            class="form-input"
            id="lead-time"
            name="lead-time"
            type="text"
            placeholder="1–2 weeks"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="stripe-price-id">
            Stripe Price ID
          </label>
          <input
            class="form-input"
            id="stripe-price-id"
            name="stripe-price-id"
            type="text"
            placeholder="price_..."
          >
        </div>

      </div>

      <div class="checkbox-row">

        <label class="checkbox-item">
          <input
            id="dishwasher-safe"
            type="checkbox"
          >
          Dishwasher safe
        </label>

        <label class="checkbox-item">
          <input
            id="microwave-safe"
            type="checkbox"
          >
          Microwave safe
        </label>

        <label class="checkbox-item">
          <input
            id="ready-to-ship"
            type="checkbox"
          >
          Ready to ship
        </label>

        <label class="checkbox-item">
          <input
            id="featured"
            type="checkbox"
          >
          Featured
        </label>

        <label class="checkbox-item">
          <input
            id="published"
            type="checkbox"
          >
          Published
        </label>

        <label class="checkbox-item">
          <input
            id="etsy-listed"
            type="checkbox"
          >
          Etsy listed
        </label>

      </div>

      <div class="admin-actions">
        <button
          class="button button-primary"
          type="submit"
        >
          Preview Product Record
        </button>

        <button
          class="button"
          id="clear-form"
          type="button"
        >
          Clear Form
        </button>
      </div>

    </form>

    <section
      id="preview"
      class="preview-box"
      hidden
    >
      <h2>Product Record Preview</h2>

      <pre
        id="preview-json"
        class="preview-json"
      ></pre>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const form =
        document.getElementById("product-form");

      const preview =
        document.getElementById("preview");

      const previewJson =
        document.getElementById("preview-json");

      const clearButton =
        document.getElementById("clear-form");

      function splitCommaList(value) {
        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function splitLineList(value) {
        return value
          .split(/\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function makeSlug(value) {
        return value
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function buildProductRecord() {
        const name =
          document.getElementById("name").value.trim();

        const enteredSlug =
          document.getElementById("slug").value.trim();

        const slug =
          enteredSlug || makeSlug(name);

        const shippingType =
          document.getElementById("shipping-type").value;

        const shippingPrice =
          Number(
            document.getElementById("shipping-price").value || 0
          );

        return {
          id: slug,
          name,
          slug,
          description:
            document.getElementById("description").value.trim(),

          price:
            Number(
              document.getElementById("price").value || 0
            ),

          currency: "USD",

          inventory:
            Number(
              document.getElementById("inventory").value || 0
            ),

          colors:
            splitCommaList(
              document.getElementById("colors").value
            ),

          dishwasherSafe:
            document.getElementById("dishwasher-safe").checked,

          microwaveSafe:
            document.getElementById("microwave-safe").checked,

          tags:
            splitCommaList(
              document.getElementById("tags").value
            ),

          readyToShip:
            document.getElementById("ready-to-ship").checked,

          leadTime:
            document.getElementById("lead-time").value.trim(),

          shipping: {
            type: shippingType,
            price:
              shippingType === "flat-rate"
                ? shippingPrice
                : 0
          },

          images:
            splitLineList(
              document.getElementById("images").value
            ),

          featured:
            document.getElementById("featured").checked,

          published:
            document.getElementById("published").checked,

          etsyListed:
            document.getElementById("etsy-listed").checked,

          stripePriceId:
            document.getElementById("stripe-price-id").value.trim()
        };
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const product =
          buildProductRecord();

        previewJson.textContent =
          JSON.stringify(product, null, 2);

        preview.hidden = false;
      });

      clearButton.addEventListener("click", () => {
        form.reset();
        preview.hidden = true;
        previewJson.textContent = "";
      });
    })();
  </script>

</body>
</html>
